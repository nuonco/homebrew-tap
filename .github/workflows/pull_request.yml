---
name: pull request checks
"on":
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Keep this name in sync with the required status check on main.
    name: check-pr / Run PR checks
    runs-on: ubuntu-latest
    steps:
      - name: Check pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^)]+\))?!?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "Pull request title must use Conventional Commits syntax."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject large files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=false
          while IFS= read -r -d '' file; do
            if [[ -f "$file" ]] && (( $(stat --format=%s "$file") > 5 * 1024 * 1024 )); then
              echo "File exceeds the 5 MB limit: $file"
              failed=true
            fi
          done < <(git diff --name-only --diff-filter=AM -z "$BASE_SHA...$HEAD_SHA")
          [[ "$failed" == false ]]

  update-status:
    # Keep this name in sync with the required status check on main.
    name: check-pr / Update PR status
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report check result
        env:
          CHECK_RESULT: ${{ needs.checks.result }}
        run: echo "PR checks finished with status $CHECK_RESULT"

  auto-approve:
    name: Auto-Approve if Nuonbot
    if: github.actor == 'nuonbot'
    runs-on: ubuntu-latest
    steps:
      - name: Approve
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr review --approve "$PR_URL"

  auto-merge:
    name: Auto-Merge if labelled
    if: contains(github.event.pull_request.labels.*.name, 'auto-merge')
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.NUON_BOT_GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --delete-branch --squash "$PR_URL"
